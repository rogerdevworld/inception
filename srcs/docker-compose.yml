name: rmarrero/inception:latest
#version: '3.8'

services:
  mariadb:
    container_name: mariadb
    build:
      context: ./requirements/mariadb
    image: mariadb
    restart: always
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inception_network

  wordpress:
    container_name: wordpress
    build:
      context: ./requirements/wordpress
    image: wordpress
    restart: always
    depends_on:
      - mariadb
      - redis
    env_file:
      - .env
    volumes:
      - website_files:/var/www/html
    networks:
      - inception_network

  nginx:
    container_name: nginx
    build:
      context: ./requirements/nginx
    image: nginx
    restart: always
    depends_on:
      - wordpress
    ports:
      - "443:443"
    env_file:
      - .env
    volumes:
      - website_files:/var/www/html
    networks:
      - inception_network

  # --- SERVICIOS BONUS ---
  redis:
    container_name: redis
    build:
      context: ./requirements/bonus/redis
    image: redis
    restart: always
    networks:
      - inception_network

  ftp:
    container_name: ftp
    build:
      context: ./requirements/bonus/ftp
    image: ftp
    restart: always
    depends_on:
      - wordpress
    env_file:
      - .env
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    volumes:
      - website_files:/var/www/html
    networks:
      - inception_network

  adminer:
    container_name: adminer
    build:
      context: ./requirements/bonus/adminer
    image: adminer
    restart: always
    depends_on:
      - mariadb
    ports:
      - "8080:8080"
    networks:
      - inception_network

  static_site:
    container_name: static_site
    build:
      context: ./requirements/bonus/static_site
    image: static_site
    restart: always
    ports:
      - "8081:8081"
    networks:
      - inception_network

  cadvisor:
    container_name: cadvisor
    build:
      context: ./requirements/bonus/cadvisor
    image: cadvisor
    restart: always
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - inception_network

networks:
  inception_network:
    driver: bridge

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${USER_DATA_PATH}/db_data
  website_files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${USER_DATA_PATH}/website_files